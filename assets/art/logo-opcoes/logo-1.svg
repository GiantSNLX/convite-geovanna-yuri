<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">Geovanna &amp; Yuri | Cl&#225;ssico Imperial</title>
  <desc id="logo-desc">Monograma G e Y verde oliva, entrela&#231;ado com um e comercial dourado, moldura dupla e duas samambaias sim&#233;tricas. Casamento em 13 de janeiro de 2027.</desc>
  <style>
    .ring { stroke-dasharray: 1; stroke-dashoffset: 0; animation: draw 2.6s ease-out both; }
    .ring-inner { animation-delay: .18s; }
    .stem { stroke-dasharray: 1; stroke-dashoffset: 0; animation: draw 2.2s .25s ease-out both; }
    .foliage { animation: reveal 1.8s .3s ease-out both; }
    .fern { transform-box: view-box; transform-origin: 57px 181px; animation: sway 6s ease-in-out infinite alternate; }
    .monogram { animation: reveal 1.8s .35s ease-out both; }
    .gold { animation: sheen 6s ease-in-out infinite alternate; }
    @keyframes draw { from { stroke-dashoffset: 1; opacity: 0; } to { stroke-dashoffset: 0; opacity: 1; } }
    @keyframes reveal { from { opacity: 0; } to { opacity: 1; } }
    @keyframes sway { from { transform: rotate(-.65deg); } to { transform: rotate(.85deg); } }
    @keyframes sheen { from { opacity: .72; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .ring, .stem, .foliage, .fern, .monogram, .gold { animation: none; }
    }
  </style>
