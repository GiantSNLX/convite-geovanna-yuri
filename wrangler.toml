name = "convite-geovanna-yuri"
main = "cloudflare/worker.mjs"
compatibility_date = "2025-04-01"
workers_dev = true

[assets]
directory = "_site"
binding = "ASSETS"
run_worker_first = [
  "/api/*",
  "/admin",
  "/admin/",
  "/healthz",
  "/casamento-yuri-geovanna.ics"
]

[build]
command = "node scripts/build-static.mjs"

[[d1_databases]]
binding = "DB"
database_name = "convite-geovanna-yuri"
database_id = "PREENCHER_COM_ID_DO_D1"
migrations_dir = "cloudflare/migrations"
